# Saytni va eslatma serverini Cloudflare'ga joylaydi
# Kerakli GitHub secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID
name: Saytni joylash

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Kalitlarni tekshirish
        run: |
          [ -z "$CLOUDFLARE_API_TOKEN" ] && exit 0
          api() { curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/$1"; }
          T=$(api user/tokens/verify | jq -c '{ok: .success, status: .result.status, errors: [.errors[]?.message]}')
          A=$(api "accounts/$CLOUDFLARE_ACCOUNT_ID" | jq -c '{ok: .success, errors: [.errors[]?.message]}')
          K=$(api "accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces" | jq -c '{ok: .success, errors: [.errors[]?.message]}')
          echo "::notice title=Tekshiruv::token=$T account=$A kv=$K idUzunligi=${#CLOUDFLARE_ACCOUNT_ID}"

      - name: Cloudflare'ga joylash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare kalitlari hali qo'shilmagan — o'tkazib yuborildi."
            exit 0
          fi
          W="npx -y wrangler@4"
          # Xato bo'lsa, sababini GitHub sahifasida ko'rsatadi
          trap 'echo "::error title=Xato::$(tail -c 1500 out.log | tr "\n" " ")"' ERR

          # 1) Obunalar bazasi (KV) — yo'q bo'lsa yaratiladi
          kv_id() { $W kv namespace list 2>>out.log | tee -a out.log | sed -n '/^\[/,$p' | jq -r '.[] | select(.title=="hisoblab-yur-subs") | .id'; }
          ID=$(kv_id)
          if [ -z "$ID" ]; then
            $W kv namespace create hisoblab-yur-subs >>out.log 2>&1
            ID=$(kv_id)
          fi
          sed -i "s/KV_ID/$ID/" wrangler.toml

          # 2) Sayt va serverni joylash (manzilni GitHub sahifasida ko'rsatamiz)
          $W deploy 2>&1 | tee -a deploy.log out.log
          URL=$(grep -o 'https://[^ ]*workers\.dev' deploy.log | head -1)
          echo "::notice title=Sayt manzili::$URL"

          # 3) Eslatma kaliti (VAPID) — faqat birinchi marta yaratiladi
          if ! $W secret list 2>>out.log | grep -q VAPID_JWK; then
            node -e "crypto.subtle.generateKey({name:'ECDSA',namedCurve:'P-256'},true,['sign']).then(k=>crypto.subtle.exportKey('jwk',k.privateKey)).then(j=>process.stdout.write(JSON.stringify(j)))" \
              | $W secret put VAPID_JWK >>out.log 2>&1
          fi
